<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tape: Take payment</title>
<link rel="stylesheet" href="../fonts.css">
<style>
body{margin:0}
.r{width:1280px;height:800px;box-sizing:border-box;display:flex;background:#101635;color:#F5F6FB;font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.35}
.r *{box-sizing:border-box}
.r h1,.r h2,.r h3,.r p{margin:0}
.r button,.r input,.r select{font:inherit}
:where(.r button,.r input,.r select){color:inherit}
.tape{width:380px;flex-shrink:0;background:#F5F6FB;color:#101635;font-family:'JetBrains Mono',monospace;font-weight:500;display:flex;flex-direction:column;padding:22px 22px 18px}
.tl{display:flex;justify-content:space-between;align-items:center;min-height:36px;padding:0 8px}
.rule{border-top:2px dashed #8E94B5;margin:8px 0}
.work{flex:1;min-width:0;padding:24px;display:flex;flex-direction:column;gap:14px}
.h{font-family:Sora,sans-serif;font-weight:700;letter-spacing:-.02em}
.btn{height:48px;padding:0 20px;border-radius:12px;border:1px solid #3A478C;background:#1E2757;font-weight:600}
.btn.p{background:#FFB000;border-color:#FFB000;color:#101635}
.dim{color:#AEB4D6}
.key{height:72px;border-radius:14px;border:1px solid #3A478C;background:#1E2757;font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700}
.q{height:72px;border-radius:14px;border:0;background:#F5F6FB;color:#101635;font-weight:700;font-size:18px}
</style>
</head>
<body>
<div class="r">
<aside class="tape" aria-label="This sale">
<div style="text-align: center; font-weight: 700; font-size: 18px">DUNE COFFEE CO.</div>
<div style="text-align: center; font-size: 13px">Sale 0042  Till 1  12:41</div>
<div class="rule"></div>
<div class="tl"><span>2 x Flat white</span><span>70.00</span></div>
<div class="tl"><span>1 x Toasted cheese</span><span>55.00</span></div>
<div class="tl"><span>1 x Brownie</span><span>30.00</span></div>
<div class="rule"></div>
<div class="tl" style="font-size: 14px"><span>VAT incl. 15%</span><span>20.22</span></div>
<div class="tl" style="font-weight: 700; font-size: 24px"><span>TOTAL</span><span>155.00</span></div>
<div class="rule"></div>
<div class="tl" style="background: #FFDB85; border-radius: 8px"><span>Cash</span><span>200.00</span></div>
<div class="tl" style="font-weight: 700; font-size: 34px; min-height: 56px"><span>CHANGE</span><span>45.00</span></div>
<div style="flex-grow: 1"></div>
<div style="text-align: center; font-size: 13px">Not saved yet</div>
</aside>
<main class="work">
<div style="display: flex; justify-content: space-between; align-items: center"><h1 class="h" style="font-size: 24px">Cash received</h1><div style="display: flex; gap: 10px"><button class="btn">Pay by card instead</button><button class="btn">Back to the sale</button></div></div>
<div style="flex-grow: 1; min-height: 0; display: flex; gap: 16px">
<div style="flex: 1 1 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-content: start">
<button class="key">7</button><button class="key">8</button><button class="key">9</button>
<button class="key">4</button><button class="key">5</button><button class="key">6</button>
<button class="key">1</button><button class="key">2</button><button class="key">3</button>
<button class="key">0</button><button class="key">.</button><button class="key" aria-label="Delete last digit" style="font-family: Inter, sans-serif; font-size: 18px">Delete</button>
</div>
<div style="width: 220px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px">
<button class="q">Exact 155.00</button><button class="q">160.00</button><button class="q" style="background: #FFB000">200.00</button><button class="q">300.00</button>
</div>
</div>
<button class="btn p" style="height: 84px; font-size: 24px">Save sale, give R 45.00 change</button>
</main>
</div>
</body>
</html>
