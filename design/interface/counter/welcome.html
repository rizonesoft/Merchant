<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Counter: Welcome</title>
<link rel="stylesheet" href="../fonts.css">
<style>
body{margin:0}
.r{width:1280px;height:800px;box-sizing:border-box;display:flex;background:#0B1028;color:#F5F6FB;font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.35}
.r *{box-sizing:border-box}
.r h1,.r h2,.r h3,.r p{margin:0}
.r button,.r input,.r select{font:inherit}
:where(.r button,.r input,.r select){color:inherit}
.h{font-family:Sora,sans-serif;font-weight:700;letter-spacing:-.02em}
.card{background:#141B3F;border:1px solid #232C5C;border-radius:16px}
.btn{height:48px;padding:0 20px;border-radius:12px;border:1px solid #2F3A75;background:#1E2757;font-weight:600}
.btn.p{background:#FFB000;border-color:#FFB000;color:#101635}
.in{height:48px;border-radius:12px;border:1px solid #2F3A75;background:#0B1028;padding:0 14px;width:100%}
.lab{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:#AEB4D6}
.dim{color:#AEB4D6}
</style>
</head>
<body>
<div class="r">
<div style="width: 520px; flex-shrink: 0; background: #101635; border-right: 1px solid #232C5C; padding: 64px 56px; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 16px">
<svg width="64" height="64" viewBox="0 0 512 512" role="img" aria-label="Merchant"><rect width="512" height="512" rx="112" fill="#1E2757"></rect><path d="M104 386L175 202L256 328L337 202L408 386" fill="none" stroke="#FFB000" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="256" cy="126" r="31" fill="#F5F6FB"></circle></svg>
<span class="h" style="font-size: 40px; letter-spacing: -0.05em">merchant</span>
</div>
<div style="display: flex; flex-direction: column; gap: 18px">
<h1 class="h" style="font-size: 44px; line-height: 1.1; color: #FFB000">The till that packs up with you.</h1>
<p class="dim" style="font-size: 18px; line-height: 1.5">Sell with no internet and no account. Everything stays on this till, encrypted, and your other tills catch up over Wi-Fi.</p>
</div>
<p class="dim" style="font-size: 13px">Version 0.1.0</p>
</div>
<main style="flex-grow: 1; padding: 56px 64px; display: flex; flex-direction: column; justify-content: center; gap: 20px">
<h2 class="h" style="font-size: 28px">Set up this till</h2>
<section class="card" style="padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h3 class="h" style="font-size: 18px">Start a new shop</h3>
<label class="lab">Shop name<input class="in" type="text" value="Dune Coffee Co."></label>
<button class="btn p" style="align-self: flex-start">Create shop</button>
</section>
<section class="card" style="padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h3 class="h" style="font-size: 18px">Join a shop that already has a till</h3>
<label class="lab">Pairing code from the other till's Tills screen<input class="in" type="text" placeholder="A1B2-C3D4-E5F6-0718-293A-4B5C-6D7E-8F90"></label>
<button class="btn" style="align-self: flex-start">Join shop</button>
</section>
<button class="btn" style="align-self: flex-start; background: transparent">Restore from a backup file</button>
</main>
</div>
</body>
</html>
