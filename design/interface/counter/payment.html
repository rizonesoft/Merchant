<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Counter: Take payment</title>
<link rel="stylesheet" href="../fonts.css">
<style>
body{margin:0}
.r{width:1280px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:#0B1028;color:#F5F6FB;font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.35}
.r *{box-sizing:border-box}
.r h1,.r h2,.r h3,.r p{margin:0}
.r button,.r input,.r select{font:inherit}
:where(.r button,.r input,.r select){color:inherit}
.top{height:64px;flex-shrink:0;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #232C5C}
.h{font-family:Sora,sans-serif;font-weight:700;letter-spacing:-.02em}
.card{background:#141B3F;border:1px solid #232C5C;border-radius:16px}
.btn{height:48px;padding:0 20px;border-radius:12px;border:1px solid #2F3A75;background:#1E2757;font-weight:600}
.btn.p{background:#FFB000;border-color:#FFB000;color:#101635}
.dim{color:#AEB4D6}
.num{font-variant-numeric:tabular-nums}
.key{height:64px;border-radius:14px;border:1px solid #2F3A75;background:#1E2757;font-size:22px;font-weight:600}
.seg{flex:1 1 0;height:52px;border:1px solid #2F3A75;background:transparent;font-weight:600;font-size:16px}
.seg.on{background:#F5F6FB;border-color:#F5F6FB;color:#101635}
</style>
</head>
<body>
<div class="r">
<header class="top">
<button class="btn" style="height: 44px">Back to cart</button>
<h1 class="h" style="font-size: 20px">Take payment</h1>
<span class="dim" style="font-size: 13px; width: 130px; text-align: right">Sale 0042, Till 1</span>
</header>
<div style="flex-grow: 1; min-height: 0; display: flex; gap: 24px; padding: 24px">
<section class="card" style="width: 420px; flex-shrink: 0; padding: 24px; display: flex; flex-direction: column; gap: 14px" aria-label="Order">
<h2 class="h" style="font-size: 18px">Order</h2>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; font-size: 16px">
<div style="display: flex; justify-content: space-between"><span>2 x Flat white</span><span class="num">R 70.00</span></div>
<div style="display: flex; justify-content: space-between"><span>1 x Toasted cheese</span><span class="num">R 55.00</span></div>
<div style="display: flex; justify-content: space-between"><span>1 x Brownie</span><span class="num">R 30.00</span></div>
</div>
<div style="border-top: 1px solid #232C5C; padding-top: 14px; display: flex; flex-direction: column; gap: 6px">
<div class="dim" style="display: flex; justify-content: space-between; font-size: 14px"><span>VAT included (15%)</span><span class="num">R 20.22</span></div>
<div class="h" style="display: flex; justify-content: space-between; font-size: 34px"><span>Due</span><span class="num">R 155.00</span></div>
</div>
</section>
<section style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px" aria-label="Payment">
<div style="display: flex">
<button class="seg on" style="border-radius: 12px 0 0 12px" aria-pressed="true">Cash</button>
<button class="seg" style="border-radius: 0 12px 12px 0; border-left: 0" aria-pressed="false">Card on the reader</button>
</div>
<div style="display: flex; gap: 16px">
<div class="card" style="flex: 1 1 0; padding: 16px 20px"><span class="dim" style="font-size: 13px">Cash received</span><div class="h num" style="font-size: 34px">R 200.00</div></div>
<div class="card" style="flex: 1 1 0; padding: 16px 20px; border-color: #FFB000"><span style="font-size: 13px; color: #FFB000">Change to give</span><div class="h num" style="font-size: 34px; color: #FFB000">R 45.00</div></div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<button class="btn" style="height: 52px">Exact R 155</button><button class="btn" style="height: 52px">R 160</button><button class="btn" style="height: 52px; border-color: #FFB000">R 200</button><button class="btn" style="height: 52px">R 300</button>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button class="key">1</button><button class="key">2</button><button class="key">3</button>
<button class="key">4</button><button class="key">5</button><button class="key">6</button>
<button class="key">7</button><button class="key">8</button><button class="key">9</button>
<button class="key">.</button><button class="key">0</button><button class="key" aria-label="Delete last digit">Del</button>
</div>
<button class="btn p" style="height: 68px; font-size: 20px">Complete sale</button>
</section>
</div>
</div>
</body>
</html>
