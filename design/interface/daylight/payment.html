<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daylight: Take payment</title>
<link rel="stylesheet" href="../fonts.css">
<style>
body{margin:0}
.r{width:1280px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:#F5F6FB;color:#101635;font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.4}
.r *{box-sizing:border-box}
.r h1,.r h2,.r h3,.r p{margin:0}
.r button,.r input,.r select{font:inherit}
:where(.r button,.r input,.r select){color:inherit}
.h{font-family:Sora,sans-serif;font-weight:700;letter-spacing:-.02em}
.card{background:#FFFFFF;border:1px solid #D6D9E8;border-radius:14px}
.btn{height:52px;padding:0 22px;border-radius:10px;border:2px solid #101635;background:#FFFFFF;font-weight:700}
.btn.p{background:#101635;color:#FFFFFF}
.btn.a{background:#FFB000;border-color:#FFB000}
.dim{color:#4A5072}
.num{font-variant-numeric:tabular-nums}
.note{height:84px;border-radius:12px;border:2px solid #101635;background:#FFFFFF;font-family:Sora,sans-serif;font-weight:700;font-size:24px}
.way{flex:1 1 0;height:64px;border-radius:12px;border:2px solid #8E94B5;background:#FFFFFF;font-weight:700;font-size:18px;color:#3B4166}
.way.on{border-color:#101635;background:#101635;color:#FFFFFF}
</style>
</head>
<body>
<div class="r">
<header style="height: 132px; flex-shrink: 0; background: #101635; color: #FFFFFF; padding: 0 32px; display: flex; align-items: center; justify-content: space-between">
<button class="btn" style="background: transparent; border-color: #FFFFFF; color: #FFFFFF">Back to the sale</button>
<div style="text-align: center"><div style="font-size: 15px; color: #C9CDE4">To pay, 4 items</div><div class="h num" style="font-size: 60px; line-height: 1.05">R 155.00</div></div>
<span style="width: 180px; text-align: right; font-size: 14px; color: #C9CDE4">Sale 0042, Till 1</span>
</header>
<div style="flex-grow: 1; min-height: 0; padding: 24px 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; gap: 14px">
<button class="way on" aria-pressed="true">Cash</button>
<button class="way" aria-pressed="false">Card on the reader</button>
</div>
<div style="flex-grow: 1; min-height: 0; display: flex; gap: 24px">
<section style="flex: 1 1 0; display: flex; flex-direction: column; gap: 14px" aria-label="Cash received">
<h2 class="h" style="font-size: 20px">Tap what the customer hands you</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<button class="note">R 200</button><button class="note">R 100</button><button class="note">R 50</button>
<button class="note">R 20</button><button class="note">R 10</button><button class="note">R 5</button>
<button class="note">R 2</button><button class="note">R 1</button><button class="note" style="font-size: 18px">Exact amount</button>
</div>
<div style="display: flex; gap: 12px"><button class="btn" style="flex: 1 1 0">Type an amount</button><button class="btn" style="flex: 1 1 0">Start again</button></div>
</section>
<section class="card" style="width: 420px; flex-shrink: 0; padding: 24px; display: flex; flex-direction: column; gap: 16px" aria-label="Change">
<div style="display: flex; justify-content: space-between; font-size: 18px"><span>Received</span><span class="num" style="font-weight: 700">R 200.00</span></div>
<div class="dim" style="font-size: 14px">1 x R 200</div>
<div style="display: flex; justify-content: space-between; font-size: 18px; border-top: 1px solid #D6D9E8; padding-top: 16px"><span>To pay</span><span class="num" style="font-weight: 700">R 155.00</span></div>
<div style="background: #FFB000; border-radius: 12px; padding: 18px 20px"><div style="font-weight: 700">Give change</div><div class="h num" style="font-size: 56px; line-height: 1.05">R 45.00</div></div>
<div style="flex-grow: 1"></div>
<button class="btn p" style="height: 76px; font-size: 22px">Finish sale</button>
</section>
</div>
</div>
</div>
</body>
</html>
