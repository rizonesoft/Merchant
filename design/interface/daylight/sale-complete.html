<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daylight: Sale complete</title>
<link rel="stylesheet" href="../fonts.css">
<style>
body{margin:0}
.r{width:1280px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#F5F6FB;color:#101635;font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.4}
.r *{box-sizing:border-box}
.r h1,.r h2,.r h3,.r p{margin:0}
.r button,.r input,.r select{font:inherit}
:where(.r button,.r input,.r select){color:inherit}
.h{font-family:Sora,sans-serif;font-weight:700;letter-spacing:-.02em}
.card{background:#FFFFFF;border:1px solid #D6D9E8;border-radius:14px}
.btn{height:52px;padding:0 22px;border-radius:10px;border:2px solid #101635;background:#FFFFFF;font-weight:700}
.btn.p{background:#101635;color:#FFFFFF}
.dim{color:#4A5072}
.num{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="r">
<div style="display: flex; align-items: center; gap: 16px">
<svg width="56" height="56" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="36" fill="#0B8A58"></circle><path d="M21 37l10 10 20-22" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<h1 class="h" style="font-size: 40px">Sale saved</h1>
</div>
<div style="width: 760px; background: #FFB000; border-radius: 20px; padding: 32px 40px; text-align: center">
<div style="font-size: 20px; font-weight: 700">Give change</div>
<div class="h num" style="font-size: 120px; line-height: 1">R 45.00</div>
<div style="font-size: 17px; font-weight: 600; margin-top: 6px">R 155.00 paid with R 200.00 cash</div>
</div>
<div class="card" style="width: 760px; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center">
<div><b>Sale 0042, 12:41</b><div class="dim" style="font-size: 14px">Receipt printed. Stored on this till, and shared with your other tills when they are in range.</div></div>
</div>
<div style="width: 760px; display: flex; gap: 14px">
<button class="btn p" style="flex: 2 1 0; height: 84px; font-size: 24px">Next customer</button>
<button class="btn" style="flex: 1 1 0; height: 84px">Print receipt again</button>
<button class="btn" style="flex: 1 1 0; height: 84px">Refund this sale</button>
</div>
</div>
</body>
</html>
