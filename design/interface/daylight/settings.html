<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daylight: Settings</title>
<link rel="stylesheet" href="../fonts.css">
<style>
body{margin:0}
.r{width:1280px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:#F5F6FB;color:#101635;font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.4}
.r *{box-sizing:border-box}
.r h1,.r h2,.r h3,.r p{margin:0}
.r button,.r input,.r select{font:inherit}
:where(.r button,.r input,.r select){color:inherit}
.bar{height:68px;flex-shrink:0;background:#FFFFFF;border-bottom:1px solid #D6D9E8;padding:0 24px;display:flex;align-items:center;gap:22px}
.tab{height:68px;padding:0 4px;border:0;border-bottom:4px solid transparent;border-top:4px solid transparent;background:transparent;font-weight:600;color:#4A5072}
.tab.on{color:#101635;border-bottom-color:#FFB000}
.h{font-family:Sora,sans-serif;font-weight:700;letter-spacing:-.02em}
.card{background:#FFFFFF;border:1px solid #D6D9E8;border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.btn{height:48px;padding:0 20px;border-radius:10px;border:2px solid #101635;background:#FFFFFF;font-weight:700}
.btn.p{background:#101635;color:#FFFFFF}
.in{height:48px;border-radius:10px;border:2px solid #8E94B5;background:#FFFFFF;padding:0 14px;width:100%}
.lab{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:#3B4166;flex:1 1 0}
.dim{color:#4A5072}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#0B6B45}
.dot{width:10px;height:10px;border-radius:50%;background:#0B8A58}
.chk{display:flex;align-items:center;gap:12px;min-height:44px;font-weight:600}
.chk input{width:24px;height:24px;accent-color:#101635}
.kv{display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="r">
<header class="bar">
<svg width="40" height="40" viewBox="0 0 512 512" role="img" aria-label="Merchant"><rect width="512" height="512" rx="112" fill="#101635"></rect><path d="M104 386L175 202L256 328L337 202L408 386" fill="none" stroke="#FFB000" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="256" cy="126" r="31" fill="#F5F6FB"></circle></svg>
<nav style="display: flex; gap: 22px" aria-label="Main">
<button class="tab">Sell</button><button class="tab">Sales</button><button class="tab">Products</button><button class="tab">Day end</button><button class="tab">Tills</button><button class="tab on" aria-current="page">Settings</button>
</nav>
<div style="flex-grow: 1"></div>
<span class="dim" style="font-size: 14px">Dune Coffee Co., Till 1</span>
<span class="sync"><span class="dot"></span>Synced 12:41</span>
</header>
<div style="flex-grow: 1; min-height: 0; padding: 20px 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-content: start">
<section class="card" aria-label="Shop">
<div><h2 class="h" style="font-size: 20px">Shop</h2><span class="dim" style="font-size: 14px">Shared with every till in the shop</span></div>
<label class="lab">Shop name, printed on receipts<input class="in" type="text" value="Dune Coffee Co."></label>
<div style="display: flex; gap: 12px"><label class="lab">Currency symbol<input class="in" type="text" value="R"></label><label class="lab">VAT rate, percent<input class="in" type="text" inputmode="decimal" value="15"></label></div>
<label class="chk"><input type="checkbox" checked>Prices already include VAT</label>
<label class="lab">Line at the bottom of receipts<input class="in" type="text" value="Thank you"></label>
<button class="btn p" style="align-self: flex-start">Save shop settings</button>
</section>
<section class="card" aria-label="Receipt printer">
<div><h2 class="h" style="font-size: 20px">Receipt printer</h2><span class="dim" style="font-size: 14px">For this till only</span></div>
<label class="lab">Printer address on the network<input class="in" type="text" value="192.168.1.50"></label>
<label class="lab">Paper width<select class="in"><option>58 mm (32 characters)</option><option>80 mm (48 characters)</option></select></label>
<label class="chk"><input type="checkbox" checked>Print a receipt after every sale</label>
<label class="chk"><input type="checkbox" checked>Open the cash drawer on cash sales</label>
<div style="display: flex; gap: 10px"><button class="btn p">Save printer</button><button class="btn">Print a test receipt</button></div>
</section>
<section class="card" aria-label="Backup">
<div><h2 class="h" style="font-size: 20px">Backup</h2><span class="dim" style="font-size: 14px">One file, locked with your passphrase. Last backup yesterday at 17:12.</span></div>
<label class="lab">Backup passphrase<input class="in" type="password" value="correct horse"></label>
<div style="display: flex; gap: 10px"><button class="btn p">Save a backup</button><button class="btn">Restore a backup</button></div>
</section>
<section class="card" aria-label="About">
<h2 class="h" style="font-size: 20px">About</h2>
<div class="kv"><span class="dim">Version</span><span>Merchant 0.1.0</span></div>
<div class="kv"><span class="dim">This till</span><span>till-9305388b</span></div>
<div class="kv"><span class="dim">Licence</span><span>AGPL-3.0, open source</span></div>
<button class="btn" style="align-self: flex-start">Open the data folder</button>
</section>
</div>
</div>
</body>
</html>
